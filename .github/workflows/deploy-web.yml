name: deploy-web

on:
  push:
    branches: [master]
  workflow_dispatch:

# Needed to push the built site to the gh-pages branch.
permissions:
  contents: write

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7-stable
      TEMPLATE_DIR: /home/runner/.local/share/godot/export_templates/4.7.stable
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and web templates
        id: cache
        uses: actions/cache@v4
        with:
          # Only the web templates are kept, not the 1.3GB archive they come
          # from — about 45MB instead, so a cache hit skips the big download.
          path: |
            ~/godot
            ${{ env.TEMPLATE_DIR }}
          key: godot-web-${{ env.GODOT_VERSION }}

      - name: Install Godot and web export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}"

          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot
          chmod +x godot
          rm godot.zip

          cd "$(mktemp -d)"
          curl -sSL -o tpl.tpz "$BASE/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q tpl.tpz
          mkdir -p "$TEMPLATE_DIR"
          cp templates/web*.zip "$TEMPLATE_DIR/"
          rm -rf tpl.tpz templates

      - name: Verify before publishing
        run: GODOT=~/godot/godot ./check.sh

      - name: Export
        run: GODOT=~/godot/godot tools/export_web.sh

      - name: Publish to gh-pages
        run: |
          set -euo pipefail
          cd build/web
          rm -f ./*.import
          touch .nojekyll
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy web build from ${GITHUB_SHA::7}"
          git push -f -q \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages
